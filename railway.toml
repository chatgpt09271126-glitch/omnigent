# Railway builds the server and web UI from source with the canonical Dockerfile.
# Pair with a Railway Postgres plugin; DATABASE_URL and PORT are injected
# automatically. Setup + the post-OSS deploy button: deploy/railway/README.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
